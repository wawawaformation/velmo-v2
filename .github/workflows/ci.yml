name: quality

on:
  push:
    branches:
      - feature/**
      - feature
      - feature-**
      - dev
      - main
  pull_request:
  # Déclenchement manuel : lance l'évaluation réelle (Azure) sur dev sans
  # attendre un merge vers main. Voir docs/ressources_gh_cli.md — `gh
  # workflow run quality --ref dev`.
  workflow_dispatch:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 4 jobs distincts (au lieu d'un seul avec toutes les étapes à la suite) :
# GitHub Actions n'affiche dans la barre latérale que les JOBS, pas les
# étapes internes à un job — les séparer rend visible où ça bloque, en plus
# de permettre l'exécution en parallèle de unit-tests/acceptance-tests.
jobs:
  # Étage 1 : fail fast et gratuit, aucune dépendance projet nécessaire.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python
        run: uv python install 3.11
      - name: Install dependencies
        run: uv sync
      - name: Lint (ruff)
        run: uv run ruff check .

  # Tests hors-ligne (fixtures SQLite/LocalKB) : aucun service réel requis,
  # tourne sur toutes les branches.
  unit-tests:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python
        run: uv python install 3.11
      # feature n'a besoin ni de vrais embeddings ni du vrai LLM Azure :
      # `sentence-transformers` tire torch/CUDA (~2,5 Go), inutile ici.
      # dev/main gardent tous les extras (utilisés par acceptance-tests
      # et real-eval, qui tournent sur ces branches).
      - name: Install dependencies
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/dev" || "${{ github.ref }}" == "refs/heads/main" ]]; then
            uv sync --all-extras
          else
            uv sync --extra llm --extra vector --extra api
          fi
      - name: Unit tests (pytest)
        run: uv run pytest tests/unit/ -v

  # Tests d'acceptance hors-ligne (fixtures SQLite/LocalKB, pas real_llm) :
  # dev/main uniquement (feature reste limitée aux tests unitaires).
  acceptance-tests:
    needs: lint
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python
        run: uv python install 3.11
      - name: Install dependencies
        run: uv sync --all-extras
      # Marqués `real_llm` (suite MLOps qualité) exclus : tapent le vrai
      # Azure, coûteux en tokens — réservés au job real-eval ci-dessous.
      - name: Acceptance tests (pytest)
        run: uv run pytest tests/acceptance/ -v -m "not real_llm"

  # Éval réelle (Azure, coûteuse) : uniquement sur main (gate de livraison
  # officiel) ou en déclenchement manuel — jamais sur un simple push dev.
  real-eval:
    needs: [unit-tests, acceptance-tests]
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    # Mêmes images que docker-compose (parité local). Le health check en
    # conteneur de Chroma échouait car `curl` n'est pas dans l'image : on
    # attend Chroma côté runner (étape dédiée) plutôt qu'en conteneur.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: velmo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d velmo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      chroma:
        image: chromadb/chroma:0.5.23
        ports:
          - 8001:8000

    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python
        run: uv python install 3.11
      - name: Install dependencies
        run: uv sync --all-extras

      - name: Wait for Chroma
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8001/api/v1/heartbeat >/dev/null; then
              echo "Chroma prêt"; exit 0
            fi
            echo "attente Chroma ($i/30)..."; sleep 2
          done
          echo "Chroma injoignable"; exit 1

      # L'évaluation interroge le VRAI agent, donc la vraie base : sans seed,
      # les 8 cas qualité (statut de commande, stock, FAQ) échouent tous et la
      # note globale tombe à 0.70 — le gate bloque pour une base vide, pas pour
      # une régression. `seed.py` crée le schéma et est idempotent.
      - name: Seed database and knowledge base
        env:
          DB_URL: postgresql+psycopg://app:app@localhost:5432/velmo
          CHROMA_HOST: localhost
          CHROMA_PORT: "8001"
        run: |
          uv run python scripts/seed.py
          uv run python scripts/seed_kb.py

      # Suite d'acceptance contre le vrai agent Azure (marqueur real_llm).
      - name: Real-agent acceptance tests (pytest)
        env:
          AZURE_AI_INFERENCE_ENDPOINT: ${{ secrets.AZURE_AI_INFERENCE_ENDPOINT }}
          AZURE_AI_INFERENCE_API_KEY: ${{ secrets.AZURE_AI_INFERENCE_API_KEY }}
          AZURE_AI_INFERENCE_MODEL: ${{ secrets.AZURE_AI_INFERENCE_MODEL }}
          AZURE_AI_CLASSIFIER_MODEL: ${{ secrets.AZURE_AI_CLASSIFIER_MODEL }}
          AZURE_CONTENT_SAFETY_ENDPOINT: ${{ secrets.AZURE_CONTENT_SAFETY_ENDPOINT }}
          CHROMA_URL: http://localhost:8001
          DB_URL: postgresql+psycopg://app:app@localhost:5432/velmo
        run: uv run pytest tests/acceptance/test_mlops.py -v -m real_llm

      # Journalise la note, écrit mlops/report.md, bloque sous le seuil du
      # manifeste. Résilient : un incident infra Azure (429/timeout) sort en
      # 0 sans produire de rapport.
      - name: MLOps eval report
        env:
          AZURE_AI_INFERENCE_ENDPOINT: ${{ secrets.AZURE_AI_INFERENCE_ENDPOINT }}
          AZURE_AI_INFERENCE_API_KEY: ${{ secrets.AZURE_AI_INFERENCE_API_KEY }}
          AZURE_AI_INFERENCE_MODEL: ${{ secrets.AZURE_AI_INFERENCE_MODEL }}
          AZURE_AI_CLASSIFIER_MODEL: ${{ secrets.AZURE_AI_CLASSIFIER_MODEL }}
          AZURE_CONTENT_SAFETY_ENDPOINT: ${{ secrets.AZURE_CONTENT_SAFETY_ENDPOINT }}
          CHROMA_URL: http://localhost:8001
          DB_URL: postgresql+psycopg://app:app@localhost:5432/velmo
        run: uv run python -m velmo.mlops.score

      # Expose le rapport comme artefact (item 3) — même si l'étape précédente
      # a bloqué la livraison (le rapport est écrit avant le contrôle de seuil).
      - name: Upload MLOps report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlops-report
          path: mlops/report.md
          if-no-files-found: ignore
