name: quality

on:
  push:
    branches:
      - feature/**
      - feature
      - feature-**
      - dev
      - main
  pull_request:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-extras

      # Etage 1: fail fast et gratuit
      - name: Lint (ruff)
        run: uv run ruff check .

      # Etage 2: tests unitaires uniquement (acceptance pour dev/main)
      - name: Test suite (pytest unit only)
        run: uv run pytest tests/unit/ -v

