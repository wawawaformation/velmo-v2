name: quality

on:
  push:
    branches:
      - feature/**
      - feature
      - feature-**
      - dev
      - main
  pull_request:
  # Déclenchement manuel : lance l'évaluation réelle (Azure) sur dev sans
  # attendre un merge vers main. Voir docs/ressources_gh_cli.md — `gh
  # workflow run quality --ref dev`.
  workflow_dispatch:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest

    # Mêmes images que docker-compose (parité local). Le health check en
    # conteneur de Chroma échouait car `curl` n'est pas dans l'image : on
    # attend Chroma côté runner (étape dédiée) plutôt qu'en conteneur.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: velmo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d velmo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      chroma:
        image: chromadb/chroma:0.5.23
        ports:
          - 8001:8000

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.11

      # feature n'a besoin ni de vrais embeddings (Chroma non joignable, tests
      # unitaires hors-ligne) ni du vrai LLM Azure : `sentence-transformers`
      # tire torch/CUDA (~2,5 Go), inutile ici et source de lenteur/collisions
      # avec `cancel-in-progress`. dev/main gardent tous les extras (vrai
      # Chroma + vrais embeddings).
      - name: Install dependencies
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/dev" || "${{ github.ref }}" == "refs/heads/main" ]]; then
            uv sync --all-extras
          else
            uv sync --extra llm --extra vector --extra api
          fi

      # Etage 1: fail fast et gratuit
      - name: Lint (ruff)
        run: uv run ruff check .

      # Attente Chroma (dev/main) : health check runner-side, curl dispo ici
      - name: Wait for Chroma
        if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8001/api/v1/heartbeat >/dev/null; then
              echo "Chroma prêt"; exit 0
            fi
            echo "attente Chroma ($i/30)..."; sleep 2
          done
          echo "Chroma injoignable"; exit 1

      # Etage 2: tests unitaires toujours, acceptance sur dev/main.
      # Les tests marqués `real_llm` (suite MLOps qualité) tapent le vrai
      # Azure — coûteux en tokens. Sur un simple push dev, on les SKIP
      # (`-m "not real_llm"`) : dev reste rapide et gratuit à chaque push.
      # L'évaluation réelle ne se déclenche que sur main ou à la demande
      # (`gh workflow run` / bouton "Run workflow") — cf. REAL_EVAL ci-dessous.
      - name: Test suite (pytest)
        env:
          AZURE_AI_INFERENCE_ENDPOINT: ${{ secrets.AZURE_AI_INFERENCE_ENDPOINT }}
          AZURE_AI_INFERENCE_API_KEY: ${{ secrets.AZURE_AI_INFERENCE_API_KEY }}
          AZURE_AI_INFERENCE_MODEL: ${{ secrets.AZURE_AI_INFERENCE_MODEL }}
          AZURE_AI_CLASSIFIER_MODEL: ${{ secrets.AZURE_AI_CLASSIFIER_MODEL }}
          AZURE_CONTENT_SAFETY_ENDPOINT: ${{ secrets.AZURE_CONTENT_SAFETY_ENDPOINT }}
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/dev" || "${{ github.ref }}" == "refs/heads/main" ]]; then
            export CHROMA_URL=http://localhost:8001
            export DB_URL=postgresql+psycopg://app:app@localhost:5432/velmo
            if [[ "${{ github.ref }}" == "refs/heads/main" || "${{ github.event_name }}" == "workflow_dispatch" ]]; then
              uv run pytest tests/ -v
            else
              uv run pytest tests/ -v -m "not real_llm"
            fi
          else
            uv run pytest tests/unit/ -v
          fi

      # Éval réelle (Azure, coûteuse) : uniquement sur main (gate de livraison
      # officiel) ou en déclenchement manuel — jamais sur un simple push dev.
      - name: Compute real-eval trigger
        id: real_eval
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" || "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      # L'évaluation interroge le VRAI agent, donc la vraie base : sans seed,
      # les 8 cas qualité (statut de commande, stock, FAQ) échouent tous et la
      # note globale tombe à 0.70 — le gate bloque pour une base vide, pas pour
      # une régression. Les tests pytest, eux, utilisent des fixtures SQLite
      # seedées et ne révélaient donc pas le problème.
      # `seed.py` crée le schéma (`Base.metadata.create_all`) et est idempotent.
      - name: Seed database and knowledge base
        if: steps.real_eval.outputs.run == 'true'
        env:
          DB_URL: postgresql+psycopg://app:app@localhost:5432/velmo
          CHROMA_HOST: localhost
          CHROMA_PORT: "8001"
        run: |
          uv run python scripts/seed.py
          uv run python scripts/seed_kb.py

      # Étage 3 (main, ou déclenchement manuel) : éval du vrai agent →
      # journalise la note, écrit mlops/report.md, bloque sous le seuil du
      # manifeste. Résilient : un incident infra Azure (429/timeout) sort en
      # 0 sans produire de rapport.
      - name: MLOps eval report
        if: steps.real_eval.outputs.run == 'true'
        env:
          AZURE_AI_INFERENCE_ENDPOINT: ${{ secrets.AZURE_AI_INFERENCE_ENDPOINT }}
          AZURE_AI_INFERENCE_API_KEY: ${{ secrets.AZURE_AI_INFERENCE_API_KEY }}
          AZURE_AI_INFERENCE_MODEL: ${{ secrets.AZURE_AI_INFERENCE_MODEL }}
          AZURE_AI_CLASSIFIER_MODEL: ${{ secrets.AZURE_AI_CLASSIFIER_MODEL }}
          AZURE_CONTENT_SAFETY_ENDPOINT: ${{ secrets.AZURE_CONTENT_SAFETY_ENDPOINT }}
          CHROMA_URL: http://localhost:8001
          DB_URL: postgresql+psycopg://app:app@localhost:5432/velmo
        run: uv run python -m velmo.mlops.score

      # Expose le rapport comme artefact (item 3) — même si l'étape précédente
      # a bloqué la livraison (le rapport est écrit avant le contrôle de seuil).
      - name: Upload MLOps report
        if: always() && steps.real_eval.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mlops-report
          path: mlops/report.md
          if-no-files-found: ignore

