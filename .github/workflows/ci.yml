name: quality

on:
  push:
    branches:
      - feature/**
      - feature
      - feature-**
      - dev
      - main
  pull_request:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest

    # Mêmes images que docker-compose (parité local). Le health check en
    # conteneur de Chroma échouait car `curl` n'est pas dans l'image : on
    # attend Chroma côté runner (étape dédiée) plutôt qu'en conteneur.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: velmo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d velmo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      chroma:
        image: chromadb/chroma:0.5.23
        ports:
          - 8001:8000

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-extras

      # Etage 1: fail fast et gratuit
      - name: Lint (ruff)
        run: uv run ruff check .

      # Attente Chroma (dev/main) : health check runner-side, curl dispo ici
      - name: Wait for Chroma
        if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8001/api/v1/heartbeat >/dev/null; then
              echo "Chroma prêt"; exit 0
            fi
            echo "attente Chroma ($i/30)..."; sleep 2
          done
          echo "Chroma injoignable"; exit 1

      # Diagnostic secrets Azure (dev/main, non bloquant) : longueurs attendues
      # endpoint=60, api_key=84, model=7. Un écart = secret mal collé
      # (retour ligne/espace). Affiche seulement longueurs + code HTTP.
      - name: Diagnose Azure secrets
        if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          EP: ${{ secrets.AZURE_AI_INFERENCE_ENDPOINT }}
          KEY: ${{ secrets.AZURE_AI_INFERENCE_API_KEY }}
          MODEL: ${{ secrets.AZURE_AI_INFERENCE_MODEL }}
        run: |
          echo "endpoint length : ${#EP} (attendu 60)"
          echo "api_key  length : ${#KEY} (attendu 84)"
          echo "model    length : ${#MODEL} (attendu 7)"
          code=$(curl -s -o /tmp/azure_resp.txt -w "%{http_code}" \
            "${EP%/}/chat/completions" \
            -H "Authorization: Bearer ${KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"model\":\"${MODEL}\",\"messages\":[{\"role\":\"user\",\"content\":\"OK\"}],\"max_completion_tokens\":16}")
          echo "HTTP status : $code (200=OK, 401=clé, 404=modèle/endpoint, 429=quota)"
          echo "---- réponse ----"; cat /tmp/azure_resp.txt || true; echo

      # Etage 2: tests unitaires toujours, acceptance sur dev/main
      - name: Test suite (pytest)
        env:
          AZURE_AI_INFERENCE_ENDPOINT: ${{ secrets.AZURE_AI_INFERENCE_ENDPOINT }}
          AZURE_AI_INFERENCE_API_KEY: ${{ secrets.AZURE_AI_INFERENCE_API_KEY }}
          AZURE_AI_INFERENCE_MODEL: ${{ secrets.AZURE_AI_INFERENCE_MODEL }}
          AZURE_AI_CLASSIFIER_MODEL: ${{ secrets.AZURE_AI_CLASSIFIER_MODEL }}
          AZURE_CONTENT_SAFETY_ENDPOINT: ${{ secrets.AZURE_CONTENT_SAFETY_ENDPOINT }}
          EVAL_MIN_SCORE: "0.8"
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/dev" || "${{ github.ref }}" == "refs/heads/main" ]]; then
            export CHROMA_URL=http://localhost:8001
            export DB_URL=postgresql+psycopg://app:app@localhost:5432/velmo
            uv run pytest tests/ -v
          else
            uv run pytest tests/unit/ -v
          fi

