name: quality

on:
  push:
    branches:
      - feature/**
      - feature
      - feature-**
      - dev
      - main
  pull_request:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest

    services:
      chroma:
        image: chromadb/chroma:latest
        ports:
          - 8001:8000
        env:
          CHROMA_PORT: "8000"
        options: >-
          --health-cmd "curl -f http://localhost:8000/api/v1 || exit 1"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 5
          --health-start-period 30s

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-extras

      # Etage 1: fail fast et gratuit
      - name: Lint (ruff)
        run: uv run ruff check .

      # Etage 2: tests unitaires toujours, acceptance sur dev/main
      - name: Test suite (pytest)
        env:
          CHROMA_URL: http://localhost:8001
          AZURE_AI_INFERENCE_ENDPOINT: ${{ secrets.AZURE_AI_INFERENCE_ENDPOINT }}
          AZURE_AI_INFERENCE_API_KEY: ${{ secrets.AZURE_AI_INFERENCE_API_KEY }}
          AZURE_AI_INFERENCE_MODEL: ${{ secrets.AZURE_AI_INFERENCE_MODEL }}
          AZURE_AI_CLASSIFIER_MODEL: ${{ secrets.AZURE_AI_CLASSIFIER_MODEL }}
          AZURE_CONTENT_SAFETY_ENDPOINT: ${{ secrets.AZURE_CONTENT_SAFETY_ENDPOINT }}
          EVAL_MIN_SCORE: "0.8"
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/dev" || "${{ github.ref }}" == "refs/heads/main" ]]; then
            uv run pytest tests/ -v
          else
            uv run pytest tests/unit/ -v
          fi

