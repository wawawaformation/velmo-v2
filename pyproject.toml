[project]
name = "velmo-v2"
version = "2.0.0"
description = "Velmo 2.0 — agent de support pour une boutique de maillots de foot collector (mémoire, garde-fous, MLOps)."
requires-python = ">=3.11,<3.12"
dependencies = [
    "pydantic>=2.7,<3",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0,<2.1",
    "psycopg[binary]>=3.1,<3.3",
    "alembic>=1.13,<2",
    "apscheduler>=3.10,<4",
    "requests>=2.34.2",
    # Manifeste d'évaluation (mlops/eval_manifest.yaml). Déclaré explicitement :
    # pyyaml n'arrivait que transitivement (chromadb, langchain-core...) — si
    # l'un d'eux s'en passait, le gate qualité cassait en ImportError.
    "pyyaml>=6,<7",
    "langfuse>=4.14.4",
]

[project.optional-dependencies]
# Mémoire long terme épisodique + RAG FAQ (client Chroma, léger).
vector = [
    "chromadb>=0.5,<0.6",
]
# Modèle d'embeddings réel (e5) pour Chroma — sépare de `vector` car
# sentence-transformers tire torch/CUDA (~2,5 Go) : import lazy dans
# chromadb (déclenché seulement à l'instanciation), inutile pour les tests
# unitaires (LocalKB/mocks), nécessaire uniquement en usage réel (dev/main
# CI, Docker).
embeddings = [
    "sentence-transformers>=3,<4",
]
# LLM via Azure AI Inference (Kimi-K2.6).
llm = [
    "langchain>=1.2,<2.0",
    "langchain-core>=1.0,<2.0",
    "langchain-azure-ai>=1.0,<2.0",
    "azure-ai-inference>=1.0.0b9",
]
# API REST (FastAPI) : couche HTTP au-dessus de Agent.respond(), destinée
# au futur front Vue.js. httpx requis par fastapi.testclient (tests).
api = [
    "fastapi>=0.139.0",
    "httpx>=0.28.1",
    "uvicorn[standard]>=0.50.1",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.6,<0.10",
    "mypy>=1.10,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/velmo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
markers = [
    "real_llm: évalue le vrai agent via Azure (skip si identifiants absents)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
