services:
  app:
    build: .
    env_file:
      - .env
    # DB_URL/CHROMA_URL de .env pointent vers localhost (valable depuis
    # l'hôte) — depuis le réseau Docker interne, il faut les noms de
    # service. Ces deux variables surchargent .env (environment: prend le
    # dessus sur env_file).
    environment:
      DB_URL: postgresql+psycopg://app:app@postgres:5432/velmo
      CHROMA_URL: http://chroma:8000
    depends_on:
      postgres:
        condition: service_healthy
      chroma:
        condition: service_started
    # Conteneur maintenu actif ; ouvrir le chat avec :
    #   docker compose exec app uv run python -m velmo.cli
    command: ["tail", "-f", "/dev/null"]

  api:
    build: .
    env_file:
      - .env
    environment:
      DB_URL: postgresql+psycopg://app:app@postgres:5432/velmo
      CHROMA_URL: http://chroma:8000
    depends_on:
      postgres:
        condition: service_healthy
      chroma:
        condition: service_started
    ports:
      - "8000:8000"
    # Logs (guardrails.log, llm_latency.log, memory.log) visibles depuis
    # l'hôte, mêmes chemins que l'exécution locale (scripts de démo).
    volumes:
      - ./logs:/app/logs
    command: ["uv", "run", "uvicorn", "velmo.api:app", "--host", "0.0.0.0", "--port", "8000"]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: velmo
    ports:
      - "5432:5432"
    volumes:
      - .docker-data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d velmo"]
      interval: 5s
      timeout: 5s
      retries: 10

  chroma:
    image: chromadb/chroma:0.5.23
    ports:
      - "8001:8000"
    volumes:
      - .docker-data/chroma:/chroma/chroma
